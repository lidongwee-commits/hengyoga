<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恒伽瑜伽管理系统</title>
<style>
  :root{
    --bg1:#f8f5ef; --bg2:#e9f3ee;
    --card:#fffdfa; --ink:#2c3a34; --muted:#8a9a92;
    --line:#ece5db; --brand:#5aa08c; --brand-d:#3c7c6b; --brand-l:#eaf4f0;
    --warn:#c79a3e; --danger:#d96b6b; --ok:#4f9d7a; --blue:#5b8bd0;
    --shadow:0 1px 2px rgba(60,90,80,.04),0 12px 34px rgba(60,90,80,.08);
    --radius:16px;
    --kai:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{display:flex;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:linear-gradient(165deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);font-size:14px;line-height:1.6;position:relative;overflow-x:hidden}

  /* ---------- 背景瑜伽元素漂浮 ---------- */
  .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .deco{position:absolute;color:var(--brand);opacity:.06;animation:float 10s ease-in-out infinite, breathe 6s ease-in-out infinite;filter:blur(.3px)}
  .deco:nth-child(1){left:8%;top:12%;font-size:140px;animation-delay:0s,1s}
  .deco:nth-child(2){right:12%;top:18%;font-size:90px;animation-delay:-2s,-1s;transform:rotate(15deg)}
  .deco:nth-child(3){left:18%;bottom:15%;font-size:110px;animation-delay:-4s,-2s;transform:rotate(-10deg)}
  .deco:nth-child(4){right:8%;bottom:22%;font-size:75px;animation-delay:-1s,-3s}
  .deco:nth-child(5){left:45%;top:8%;font-size:55px;animation-delay:-3s,0s;opacity:.05}
  .deco:nth-child(6){left:6%;top:55%;font-size:65px;animation-delay:-5s,-2s;opacity:.05}
  .deco:nth-child(7){right:22%;top:55%;font-size:80px;animation-delay:-6s,-4s;opacity:.04}
  .deco:nth-child(8){left:62%;bottom:10%;font-size:50px;animation-delay:-2.5s,-1.5s;opacity:.05}
  @keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-18px) rotate(calc(var(--r,0deg) + 3deg))}}
  @keyframes breathe{0%,100%{opacity:.04}50%{opacity:.09}}

  /* ---------- 侧边栏 ---------- */
  .sidebar{width:248px;flex-shrink:0;background:rgba(255,253,250,.7);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;backdrop-filter:blur(10px);z-index:1}
  .brand{padding:24px 22px;background:linear-gradient(135deg,var(--brand-d),var(--brand));color:#fff;display:flex;align-items:center;gap:11px}
  .brand .logo{font-family:var(--kai);font-size:22px;font-weight:700;letter-spacing:2px;display:flex;align-items:center}
  .brand .lotus{margin-right:8px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
  .nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:5px;overflow-y:auto}
  .nav button{display:flex;align-items:center;gap:12px;background:none;border:none;padding:11px 15px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:14px;text-align:left;width:100%;transition:.18s;position:relative;overflow:hidden}
  .nav button .ic{font-size:16px;width:22px;text-align:center;z-index:1}
  .nav button .label{z-index:1}
  .nav button::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--brand);transition:.25s;opacity:.12;border-radius:0 12px 12px 0}
  .nav button:hover{background:var(--brand-l);color:var(--brand-d)}
  .nav button:hover::before{width:100%}
  .nav button.active{background:var(--brand-l);color:var(--brand-d);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
  .nav button.active::before{width:100%}

  /* ---------- 内容区 ---------- */
  .content{flex:1;display:flex;flex-direction:column;min-width:0;z-index:1}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;background:rgba(255,253,250,.75);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
  .topbar h1{font-size:18px;font-weight:600;font-family:var(--kai);letter-spacing:1px}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .lockbtn{background:var(--brand-l);border:1px solid var(--brand);color:var(--brand-d);padding:7px 15px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
  .lockbtn:hover{background:#dcefe8}
  .statusbar{background:rgba(255,253,250,.78);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;padding:9px 30px;line-height:1.6;display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px)}
  .statusbar .pill{display:inline-flex;align-items:center;gap:6px;background:#f3f6f4;border:1px solid var(--line);padding:4px 10px;border-radius:999px;transition:.2s}
  .statusbar .pill.on{background:#e8f5ee;border-color:#b8dec8;color:#2f6d4f}
  .statusbar .pill.off{background:#fdf1f1;border-color:#f0d4d4;color:#a04242}
  .statusbar .pill .dot{width:7px;height:7px;border-radius:50%;background:#9bbdb1}
  .statusbar .pill.on .dot{background:#4f9d7a;animation:pulse 1.6s infinite}
  .statusbar .pill.off .dot{background:#d96b6b}
  .statusbar .sep{color:var(--line)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,157,122,.4)}70%{box-shadow:0 0 0 5px rgba(79,157,122,0)}100%{box-shadow:0 0 0 0 rgba(79,157,122,0)}}
  main{padding:24px 30px;max-width:1180px;width:100%;margin:0 auto;flex:1;animation:fade .35s cubic-bezier(.22,.61,.36,1)}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  @keyframes countUp{from{opacity:.5;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  @keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:15px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);transition:.2s;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;right:-22px;top:-22px;width:74px;height:74px;border-radius:50%;background:var(--brand-l);opacity:.55}
  .stat::before{content:"";position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:none;pointer-events:none}
  .stat:hover::before{animation:shine .85s ease forwards}
  @keyframes shine{to{left:150%}}
  .stat:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(60,90,80,.12)}
  .stat .n{font-size:30px;font-weight:800;color:var(--brand-d);position:relative;animation:countUp .45s cubic-bezier(.22,.61,.36,1)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:6px;position:relative}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .btn{background:var(--brand);color:#fff;border:none;padding:10px 17px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:500;transition:.18s;box-shadow:0 4px 12px rgba(90,160,140,.25);position:relative;overflow:hidden}
  .btn:hover{background:var(--brand-d);transform:translateY(-1px);box-shadow:0 6px 16px rgba(90,160,140,.32)}
  .btn:active{transform:translateY(0)}
  .btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:ripple .55s linear;pointer-events:none}
  @keyframes ripple{to{transform:scale(4);opacity:0}}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{background:var(--brand-l);border-color:var(--brand-l)}
  .btn.danger{background:var(--danger);box-shadow:0 4px 12px rgba(217,107,107,.25)}
  .btn.danger:hover{background:#c75a5a}
  .btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  th,td{padding:12px 15px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{background:var(--brand-l);color:var(--brand-d);font-weight:600;font-size:12px;letter-spacing:.3px}
  tr:last-child td{border-bottom:none}
  tbody tr{animation:rowIn .35s cubic-bezier(.22,.61,.36,1) both}
  tbody tr:hover{background:#f6faf9}
  .subrow{background:#fafbfa}
  .subrow td:first-child{padding-left:38px;color:var(--muted)}
  /* 分组 + 拖拽排序 */
  .grp-main{box-shadow:inset 4px 0 0 #bfe3d8;background:#f4fbf9}
  .grp-main:hover{background:#eef9f6}
  .drag-h{width:1px;white-space:nowrap;padding-right:4px!important}
  .handle{cursor:grab;color:#9bbdb1;font-size:15px;user-select:none;display:inline-block;vertical-align:middle;line-height:1}
  .handle:hover{color:var(--brand-d)}
  .handle:active{cursor:grabbing}
  .mv{display:inline-flex;gap:2px;margin-left:5px;vertical-align:middle}
  .mv .btn{padding:1px 6px;font-size:10px;line-height:1.4}
  .grp-cap{font-size:11px;color:var(--muted);margin:14px 2px 4px;font-weight:600}

  .tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600}
  .t-active{background:#d9f2e6;color:#2c7a55}
  .t-left{background:#fae0e0;color:#a13a3a}
  .t-inuse{background:#dbeafe;color:#2c5aa8}
  .t-standby{background:#eef2f0;color:#5a6b64}
  .t-replaced,.t-retired,.t-cancelled{background:#eef2f0;color:#9ca3af}
  .t-main{background:#fbeecb;color:#8a6516}
  .t-sub{background:#ece7fb;color:#5b3aa6}
  .muted{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:44px}
  .sec-title{font-size:17px;font-weight:600;margin:24px 0 13px;color:var(--ink);font-family:var(--kai);letter-spacing:1px}

  /* ---------- 面板（设置页） ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
  .panel-head{padding:14px 18px;background:var(--brand-l);border-bottom:1px solid var(--line);font-weight:600;color:var(--brand-d);font-family:var(--kai);letter-spacing:.5px}
  .panel-body{padding:18px}

  /* ---------- 模态 ---------- */
  .modal-mask{position:fixed;inset:0;background:rgba(30,45,40,.4);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:50;overflow:auto}
  .modal-mask.show{display:flex}
  .modal{background:#fffdfa;border-radius:18px;width:100%;max-width:520px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.25);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
  .modal h3{margin-bottom:18px;font-size:18px;color:var(--brand-d);font-family:var(--kai);letter-spacing:1px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;transition:.15s;background:#fffdfa}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
  .field textarea{resize:vertical;min-height:54px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}

  .log-item{border-left:3px solid var(--brand);background:var(--card);padding:12px 16px;margin-bottom:10px;border-radius:0 12px 12px 0;box-shadow:var(--shadow)}
  .log-item .t{font-size:12px;color:var(--muted)}
  .log-item .d{margin-top:4px}
  .pwd-cell{font-family:monospace;white-space:nowrap}
  .eye{cursor:pointer;color:var(--blue);font-size:12px;margin-left:6px;user-select:none}
  .eye:hover{text-decoration:underline}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
  .hint code{background:#f1f5f4;padding:1px 6px;border-radius:5px;font-size:11px}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:5px;font-size:13px;margin-bottom:13px}
  .fld>span{color:var(--muted);font-size:12px}
  .fld input,.fld select{font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fffdfa}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
  #syncBadge{font-weight:600}
  #syncBadge:empty{display:none}

  /* ---------- 响应式 / 手机端 ---------- */
  @media(max-width:820px){
    body{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex-direction:column;border-right:none;border-bottom:1px solid var(--line);background:rgba(255,253,250,.92)}
    .brand{padding:14px 18px}
    .nav{flex-direction:row;overflow-x:auto;padding:10px 14px;gap:8px}
    .nav button{flex:0 0 auto;width:auto;white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff}
    .nav button .ic{width:auto}
    .nav button.active{border-color:var(--brand);box-shadow:none;background:var(--brand-l)}
    .side-foot{display:none}
    .topbar{padding:12px 16px}
    .statusbar{padding:8px 16px;gap:8px;flex-wrap:wrap}
    main{padding:16px;padding-bottom:32px}
    .cards{grid-template-columns:repeat(2,1fr);gap:11px}
    table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
    th,td{white-space:nowrap}
  }
  @media(max-width:480px){
    .topbar h1{font-size:16px}
    .stat .n{font-size:25px}
    .topbar .sub{font-size:11px}
  }

  /* ---------- 启动解锁（加密文件打开时） ---------- */
  .bootlock{position:fixed;inset:0;background:linear-gradient(150deg,#3c7c6b,#5aa08c);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .bootcard{background:#fffdfa;border-radius:22px;padding:36px 34px;width:360px;max-width:94%;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.3)}
  .bootcard .logo{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--kai);font-size:22px;font-weight:700;color:var(--brand-d);margin-bottom:12px;letter-spacing:2px}
  .bootcard p{font-size:13px;color:var(--muted);margin:8px 0}
  .bootcard input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-size:15px;margin:14px 0;text-align:center;background:#fff}
  .bootcard input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
  .bootcard .btn{width:100%;padding:12px}
  .lotus{vertical-align:middle}

  /* ---------- Toast ---------- */
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(34,51,46,.92);color:#fff;padding:10px 20px;border-radius:999px;z-index:99;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.22);opacity:0;animation:toastIn .35s cubic-bezier(.22,.61,.36,1) forwards}
  @keyframes toastIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .toast.out{animation:toastOut .25s ease forwards}
  @keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(10px)}}

  /* ---------- 骨架屏 ---------- */
  .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
</style>
</head>
<body>
<div class="bg-deco" aria-hidden="true">
  <svg class="deco" viewBox="0 0 48 48" width="1em" height="1em"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 42 C24 31 24 21 24 11"/><path d="M24 40 C15 36 10 28 9 20 C16 23 21 31 24 40 Z"/><path d="M24 40 C33 36 38 28 39 20 C32 23 27 31 24 40 Z"/><path d="M24 41 C18 41 13 38 12 33 C17 34 21 37 24 41 Z"/><path d="M24 41 C30 41 35 38 36 33 C31 34 27 37 24 41 Z"/></g></svg>
  <svg class="deco" viewBox="0 0 48 48" width="1em" height="1em" style="--r:15deg"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 7 A18 18 0 1 0 32 41 A14 14 0 1 1 32 7 Z"/></g></svg>
  <svg class="deco" viewBox="0 0 48 48" width="1em" height="1em" style="--r:-10deg"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="11"/><circle cx="24" cy="24" r="4"/><path d="M24 6 L24 13 M24 35 L24 42 M6 24 L13 24 M35 24 L42 24 M11 11 L16 16 M32 32 L37 37 M37 11 L32 16 M16 32 L11 37"/></g></svg>
  <svg class="deco" viewBox="0 0 48 48" width="1em" height="1em"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 16 Q14 8 23 16 T41 16"/><path d="M5 24 Q14 16 23 24 T41 24"/><path d="M5 32 Q14 24 23 32 T41 32"/></g></svg>
  <svg class="deco" viewBox="0 0 48 48" width="1em" height="1em"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 43 C24 31 21 23 24 7"/><path d="M24 31 C18 29 14 24 14 16 C20 18 24 23 24 31 Z"/><path d="M24 23 C30 21 34 16 34 8 C28 10 24 15 24 23 Z"/></g></svg>
  <svg class="deco" viewBox="0 0 48 48" width="1em" height="1em" style="--r:8deg"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="24" cy="24" r="7"/><path d="M24 4 L24 13 M24 35 L24 44 M4 24 L13 24 M35 24 L44 24 M10 10 L16 16 M32 32 L38 38 M38 10 L32 16 M16 32 L10 38"/></g></svg>
  <svg class="deco" viewBox="0 0 48 48" width="1em" height="1em" style="--r:-5deg"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="9"/></g><circle cx="24" cy="24" r="3" fill="currentColor" fill-opacity=".6"/></svg>
  <svg class="deco" viewBox="0 0 48 48" width="1em" height="1em" style="--r:12deg"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="24" r="6"/><path d="M19 18 A6 6 19 18 0 19 30 A3.5 3.5 0 1 1 19 18 Z"/><path d="M29 18 A6 6 0 1 1 29 30 A3.5 3.5 0 1 0 29 18 Z"/><circle cx="39" cy="24" r="6" fill="currentColor" fill-opacity=".45"/></g></svg>
</div>
<aside class="sidebar">
  <div class="brand">
    <div class="logo"><svg class="lotus" viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><g fill="currentColor"><path d="M24 41 C22.5 30 23 20 24 11 C25 20 25.5 30 24 41 Z"/><path d="M24 40 C15 36 9 29 9 21 C16 24 21 31 24 40 Z"/><path d="M24 40 C33 36 39 29 39 21 C32 24 27 31 24 40 Z"/><path d="M24 41 C17 41 11 37 10 32 C16 33 21 36 24 41 Z"/><path d="M24 41 C31 41 37 37 38 32 C32 33 27 36 24 41 Z"/></g></svg>恒伽瑜伽</div>
  </div>
  <nav class="nav" id="nav">
    <button data-tab="overview" class="active"><span class="ic">📊</span><span class="label">总览</span></button>
    <button data-tab="employees"><span class="ic">👥</span><span class="label">员工</span></button>
    <button data-tab="devices"><span class="ic">📱</span><span class="label">手机</span></button>
    <button data-tab="numbers"><span class="ic">☎️</span><span class="label">号码（主副卡）</span></button>
    <button data-tab="creds"><span class="ic">🔑</span><span class="label">密码库</span></button>
    <button data-tab="assign"><span class="ic">🔄</span><span class="label">分配 / 变更</span></button>
    <button data-tab="logs"><span class="ic">📜</span><span class="label">变更记录</span></button>
    <button data-tab="settings"><span class="ic">⚙️</span><span class="label">备份设置</span></button>
  </nav>
  <div class="side-foot"></div>
</aside>

<div class="content">
  <header class="topbar">
    <div>
      <h1 id="pageTitle">总览</h1>
      <div class="sub" id="pageSub">实时状态 · 资产 · 人员 · 凭据</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="syncBadgeTop" style="font-size:12px;color:var(--muted);font-weight:600"></span>
      <button class="lockbtn" id="lockBtn" onclick="toggleLock()">🔒 设置/解锁密码锁</button>
    </div>
  </header>
  <div class="statusbar" id="statusBar">
    <span class="pill" id="lockPill"><span class="dot"></span><span id="lockText">数据已锁定</span></span>
    <span class="sep">·</span>
    <span id="storeText">数据存于本机浏览器</span>
    <span class="sep">·</span>
    <span id="syncBadgeMini"></span>
  </div>
  <main id="main"></main>
</div>
<div class="modal-mask" id="mask"><div class="modal" id="modal"></div></div>

<div class="bootlock" id="bootLock">
  <div class="bootcard">
    <div class="logo"><svg class="lotus" viewBox="0 0 48 48" width="24" height="24" aria-hidden="true"><g fill="currentColor"><path d="M24 41 C22.5 30 23 20 24 11 C25 20 25.5 30 24 41 Z"/><path d="M24 40 C15 36 9 29 9 21 C16 24 21 31 24 40 Z"/><path d="M24 40 C33 36 39 29 39 21 C32 24 27 31 24 40 Z"/><path d="M24 41 C17 41 11 37 10 32 C16 33 21 36 24 41 Z"/><path d="M24 41 C31 41 37 37 38 32 C32 33 27 36 24 41 Z"/></g></svg>恒伽瑜伽管理系统</div>
    <p>此文件含加密数据，请输入主密码解锁</p>
    <input id="bootPwd" type="password" placeholder="主密码" onkeydown="if(event.key==='Enter')bootUnlock()">
    <button class="btn" onclick="bootUnlock()">解锁</button>
    <p class="hint">忘记主密码时，可用「恢复码」解锁（首次设密码时生成，请妥善保存）。</p>
  </div>
</div>

<script>
const KEY='yoga_asset_data_v2';
const TAB_NAMES={overview:'总览',employees:'员工',devices:'手机',numbers:'号码（主副卡）',creds:'密码库',assign:'分配 / 变更',logs:'变更记录',settings:'备份设置'};
let state=load();
let unlocked=false;
let currentTab='overview';

/* ---------- 轻量哈希（查看锁用，非加密存储） ---------- */
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');}

let bootEnc=null;
let masterPwd=null;
const KEY_W='hejia_wraps_v1';
let dataKey=null;
function load(){try{if(window.__INIT__)return window.__INIT__;if(window.__ENC__){bootEnc=window.__ENC__;return {pwdHash:null,recoveryKey:'',pwdHint:'',employees:[],devices:[],numbers:[],credentials:[],assignments:[],logs:[]};}const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return {pwdHash:null,recoveryKey:'',pwdHint:'',employees:[],devices:[],numbers:[],credentials:[],assignments:[],logs:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(state));scheduleSync();}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function nowStr(){return new Date().toLocaleString('zh-CN',{hour12:false});}
function today(){return new Date().toISOString().slice(0,10);}
function log(type,desc){state.logs.unshift({id:uid('log'),time:nowStr(),type,desc});save();}

/* ---------- 查看锁 + 主密码 + 恢复码 ---------- */
async function attemptUnlock(password){
  const w=loadWraps();
  if(!w||(!w.masterWrap&&!w.recoveryWrap))return false;
  const list=[w.masterWrap,w.recoveryWrap].filter(Boolean);
  for(const x of list){try{dataKey=await unwrapKey(x,password);unlocked=true;masterPwd=password;renderLock();maybeAutoPull();return true;}catch(e){}}
  return false;
}
async function toggleLock(){
  if(unlocked){unlocked=false;masterPwd=null;dataKey=null;renderLock();toast('已上锁');return;}
  if(!state.pwdHash){await setPwd();return;}
  const p=prompt('输入主密码解锁（忘记可改用恢复码）：');if(p===null)return;
  if(await attemptUnlock(p)){toast('已解锁');}
  else if(confirm('主密码错误。'+(state.pwdHint?('提示：'+state.pwdHint+'\n\n'):'')+'是否使用恢复码解锁？')){const r=prompt('输入恢复码：');if(r&&await attemptUnlock(r))toast('已用恢复码解锁');else if(r)alert('恢复码错误');}
  else alert('主密码错误');
}
async function setPwd(){
  if(state.pwdHash){const cur=prompt('输入当前主密码：');if(cur===null)return;if(!(await attemptUnlock(cur))){alert('当前密码错误');return;}}
  const p=prompt('设置新主密码（至少4位，请自己牢记，无需告知任何人）：');if(p===null)return;if(p.length<4){alert('至少4位');return;}
  const rk=genRecoveryKey();
  const hint=prompt('（可选）设置主密码提示，忘记时帮你回忆，不会泄露密码：','')||'';
  state.pwdHash=cyrb53(p);state.recoveryKey=rk;state.pwdHint=hint;
  dataKey=randBytes(32);
  const mw=await wrapKey(dataKey,p);const rw=await wrapKey(dataKey,rk);
  saveWraps({masterWrap:mw,recoveryWrap:rw,recoveryKey:rk,pwdHint:hint});
  masterPwd=p;unlocked=true;renderLock();
  alert('⚠️ 请立即抄下你的恢复码（忘记主密码时可用它解锁，与密码等效）：\n\n'+rk+'\n\n建议手抄或存到别的密码管理器。此码仅显示这一次。');
  toast('主密码已设置');render();maybeAutoPull();
}
function renderLock(){
  const b=document.getElementById('lockBtn');
  b.textContent=unlocked?'🔓 已解锁（点此上锁）':'🔒 设置/解锁密码锁';
}
async function ensureUnlocked(cb){
  if(unlocked){cb();return;}
  if(!state.pwdHash){await setPwd();if(unlocked)cb();return;}
  const p=prompt('输入主密码以查看：');if(p===null)return;
  if(await attemptUnlock(p)){cb();}
  else if(confirm('主密码错误。'+(state.pwdHint?('提示：'+state.pwdHint+'\n\n'):'')+'用恢复码解锁？')){const r=prompt('恢复码：');if(r&&await attemptUnlock(r))cb();else if(r)alert('恢复码错误');}
  else alert('主密码错误');
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260);},1800);}

/* ---------- 密码单元格 ---------- */
function pwdCell(kind,id,field){
  return `<span id="pw_${kind}_${id}_${field}">••••••</span><span class="eye" onclick="revealPwd('${kind}','${id}','${field}')">显示</span>`;
}
function revealPwd(kind,id,field){
  ensureUnlocked(()=>{
    let val='';
    if(kind==='num')val=(state.numbers.find(n=>n.id===id)||{})[field]||'';
    else if(kind==='dev')val=(state.devices.find(d=>d.id===id)||{})[field]||'';
    else if(kind==='cred')val=(state.credentials.find(c=>c.id===id)||{})[field]||'';
    else if(kind==='emp')val=(state.employees.find(e=>e.id===id)||{})[field]||'';
    const el=document.getElementById(`pw_${kind}_${id}_${field}`);if(el)el.textContent=val||'(空)';
  });
}

/* ---------- 状态映射 ---------- */
const EMP_ST={active:['在职','t-active'],left:['离职','t-left']};
const DEV_ST={in_use:['在用','t-inuse'],standby:['备用','t-standby'],replaced:['已替换','t-replaced'],retired:['报废','t-retired']};
const NUM_ST={in_use:['在用','t-inuse'],standby:['备用','t-standby'],cancelled:['已销号','t-cancelled']};
const NUM_TYPE={main:['主卡','t-main'],sub:['副卡','t-sub']};
function tag(map,key){const v=map[key]||['?','t-standby'];return `<span class="tag ${v[1]}">${v[0]}</span>`;}
function nameOf(arr,id){const x=arr.find(a=>a.id===id);return x?(x.name||x.number||x.model||x.account||'—'):'—';}
function mainNumbers(){return state.numbers.filter(n=>n.type==='main');}
function subOf(mainId){return state.numbers.filter(n=>n.type==='sub'&&n.parentId===mainId);}

/* ---------- 导航 ---------- */
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;currentTab=b.dataset.tab;[...document.querySelectorAll('#nav button')].forEach(x=>x.classList.toggle('active',x===b));document.getElementById('pageTitle').textContent=TAB_NAMES[currentTab]||'总览';render();});
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal();});

/* ---------- 通用模态 ---------- */
function openModal(title,html,wide){document.getElementById('modal').innerHTML=`<h3>${title}</h3>${html}<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="modalOk">保存</button></div>`;if(wide)document.getElementById('modal').style.maxWidth='560px';document.getElementById('mask').classList.add('show');}
function closeModal(){document.getElementById('mask').classList.remove('show');}
function field(label,name,type='text',val='',opts=''){val=val==null?'':val;
  if(type==='select')return `<div class="field"><label>${label}</label><select name="${name}">${opts}</select></div>`;
  if(type==='textarea')return `<div class="field"><label>${label}</label><textarea name="${name}">${val}</textarea></div>`;
  return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${val}"></div>`;}
function readForm(){const f=document.getElementById('modal');const o={};[...f.querySelectorAll('[name]')].forEach(i=>o[i.name]=i.value.trim());return o;}

/* ---------- 渲染分发 ---------- */
function render(){const m=document.getElementById('main');
  const titles={overview:['总览','实时状态 · 资产 · 人员 · 凭据'],employees:['员工管理','在职 / 离职 · 身份证 · 变更留痕'],devices:['手机资产','型号 / 内存 / 苹果ID · 设备全命周期'],numbers:['号码管理','主副卡 · 微信 / 邮箱 / 实名 · 话费'],creds:['密码库','监考 / 平台账号 · 集中安全存储'],assign:['分配 / 变更','人 · 机 · 号 绑定与变更'],logs:['变更记录','每次操作自动留痕 · 倒序排列'],settings:['备份设置','加密备份 / 自动云同步 / 恢复码']};
  const t=titles[currentTab]||titles.overview;
  const pt=document.getElementById('pageTitle');if(pt)pt.textContent=t[0];
  const ps=document.getElementById('pageSub');if(ps){ps.textContent=t[1];ps.style.animation='none';ps.offsetHeight;ps.style.animation='slideIn .4s ease';}
  if(currentTab==='overview')m.innerHTML=renderOverview();
  else if(currentTab==='employees')m.innerHTML=renderEmployees();
  else if(currentTab==='devices')m.innerHTML=renderDevices();
  else if(currentTab==='numbers')m.innerHTML=renderNumbers();
  else if(currentTab==='creds')m.innerHTML=renderCreds();
  else if(currentTab==='assign')m.innerHTML=renderAssign();
  else if(currentTab==='logs')m.innerHTML=renderLogs();
  else if(currentTab==='settings')m.innerHTML=renderSettings();
  setSyncBadge();
  updateStatusBar();
  bindRipples();
  staggerRows();
}

/* ---------- 总览 ---------- */
function renderOverview(){
  const activeEmp=state.employees.filter(e=>e.status==='active').length;
  const inUseDev=state.devices.filter(d=>d.status==='in_use').length;
  const mains=mainNumbers().length, subs=state.numbers.filter(n=>n.type==='sub').length;
  const cur=state.assignments.filter(a=>!a.endDate);
  let rows=cur.map(a=>{const dev=state.devices.find(d=>d.id===a.devId);const num=state.numbers.find(n=>n.id===a.numId);
    return `<tr><td>${nameOf(state.employees,a.empId)}</td><td>${dev?dev.model+' '+dev.storage:'(未绑)'}</td><td>${num?num.number+(num.type==='sub'?'（副）':''):'(未绑)'}</td><td>${num?num.wechat:''}</td><td class="muted">${a.startDate}</td></tr>`;}).join('');
  if(!rows)rows=`<tr><td colspan="5" class="empty">暂无在职分配</td></tr>`;
  return `<div class="cards">
    <div class="stat"><div class="n">${activeEmp}</div><div class="l">在职员工</div></div>
    <div class="stat"><div class="n">${inUseDev}</div><div class="l">在用手机</div></div>
    <div class="stat"><div class="n">${mains}</div><div class="l">主卡号码</div></div>
    <div class="stat"><div class="n">${subs}</div><div class="l">副卡号码</div></div>
  </div>
  <div class="sec-title">当前「人 · 机 · 号」对照</div>
  <table><thead><tr><th>员工</th><th>手机(型号/内存)</th><th>号码</th><th>绑定微信</th><th>起始日</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- 员工 ---------- */
function renderEmployees(){
  const rows=state.employees.map(e=>`<tr><td class="drag-h"><span class="handle" draggable="true" ondragstart="dragStart(event,'emp','${e.id}')" ondragover="event.preventDefault()" ondrop="dropEmp('${e.id}')" title="拖动排序">⠿</span><span class="mv"><button class="btn ghost sm" onclick="moveEmp('${e.id}','up')" title="上移">▲</button><button class="btn ghost sm" onclick="moveEmp('${e.id}','down')" title="下移">▼</button></span></td><td>${e.name}</td><td>${e.joinDate||'—'}</td><td>${e.leaveDate||'—'}</td><td>${tag(EMP_ST,e.status)}</td><td>${e.idNumber?pwdCell('emp',e.id,'idNumber'):'—'}</td><td>${e.note||''}</td>
    <td><div class="row-actions"><button class="btn ghost sm" onclick="editEmp('${e.id}')">编辑</button>${e.status==='active'?`<button class="btn danger sm" onclick="leaveEmp('${e.id}')">办理离职</button>`:''}<button class="btn ghost sm" onclick="delEmp('${e.id}')">删除</button></div></td></tr>`).join('');
  return `<div class="toolbar"><button class="btn" onclick="addEmp()">+ 新增员工</button><span class="hint">办理离职会一键回收其手机与号码并留痕。⠿ 可拖动或用 ▲▼ 调整顺序。</span></div>
    <table><thead><tr><th>排序</th><th>姓名</th><th>入职日</th><th>离职日</th><th>状态</th><th>身份证(可几位)</th><th>备注</th><th>操作</th></tr></thead><tbody>${rows||`<tr><td colspan="8" class="empty">还没有员工</td></tr>`}</tbody></table>`;
}
function empForm(e){e=e||{};return field('姓名*','name','text',e.name)+field('入职日期','joinDate','date',e.joinDate)+field('离职日期','leaveDate','date',e.leaveDate)+field('身份证号(可只填几位)','idNumber','text',e.idNumber)+field('备注','note','textarea',e.note);}
function addEmp(){openModal('新增员工',empForm());ok(()=>{const o=readForm();if(!o.name){alert('请填姓名');return;}state.employees.push({id:uid('emp'),name:o.name,joinDate:o.joinDate,leaveDate:o.leaveDate,idNumber:o.idNumber,status:'active',note:o.note});log('入职',`新增员工：${o.name}`);save();closeModal();render();});}
function editEmp(id){const e=state.employees.find(x=>x.id===id);openModal('编辑员工',empForm(e));ok(()=>{const o=readForm();if(!o.name){alert('请填姓名');return;}Object.assign(e,{name:o.name,joinDate:o.joinDate,leaveDate:o.leaveDate,idNumber:o.idNumber,note:o.note});log('编辑',`编辑员工：${o.name}`);save();closeModal();render();});}
function delEmp(id){const e=state.employees.find(x=>x.id===id);if(!confirm(`删除员工「${e.name}」？`))return;if(state.assignments.some(a=>a.empId===id&&!a.endDate)){alert('该员工仍有在职分配，请先办理离职');return;}state.employees=state.employees.filter(x=>x.id!==id);log('删除',`删除员工：${e.name}`);save();render();}

/* ---------- 排序（拖动 / 上下移） ---------- */
let DRAG=null;
function dragStart(e,kind,id){DRAG={kind,id};if(e&&e.dataTransfer)e.dataTransfer.effectAllowed='move';}
function dropEmp(id){
  if(!DRAG||DRAG.kind!=='emp')return;
  const d=DRAG;DRAG=null;
  const from=state.employees.findIndex(x=>x.id===d.id);
  const to=state.employees.findIndex(x=>x.id===id);
  if(from<0||to<0||from===to)return;
  const [it]=state.employees.splice(from,1);
  state.employees.splice(to,0,it);
  save();render();
}
function moveEmp(id,dir){
  const i=state.employees.findIndex(x=>x.id===id);
  const j=i+(dir==='up'?-1:1);
  if(j<0||j>=state.employees.length)return;
  const [it]=state.employees.splice(i,1);
  state.employees.splice(j,0,it);
  save();render();
}
function reorderNumGroup(fromId,toId){
  const mains=mainNumbers();
  const fm=mains.find(x=>x.id===fromId),tm=mains.find(x=>x.id===toId);
  if(!fm||!tm||fm.id===tm.id)return;
  const group=[fm,...subOf(fm.id)],ids=new Set(group.map(g=>g.id));
  state.numbers=state.numbers.filter(n=>!ids.has(n.id));
  const idx=state.numbers.findIndex(n=>n.id===tm.id);
  const at=idx<0?state.numbers.length:idx;
  group.forEach((g,k)=>state.numbers.splice(at+k,0,g));
  save();render();
}
function dropNum(id){
  if(!DRAG||DRAG.kind!=='num')return;
  const d=DRAG;DRAG=null;
  reorderNumGroup(d.id,id);
}
function moveNum(id,dir){
  const mains=mainNumbers();
  const i=mains.findIndex(x=>x.id===id);
  const j=i+(dir==='up'?-1:1);
  if(j<0||j>=mains.length)return;
  reorderNumGroup(id,mains[j].id);
}
function leaveEmp(id){const e=state.employees.find(x=>x.id===id);if(!confirm(`为「${e.name}」办理离职？自动结束分配并回收手机/号码。`))return;
  const cur=state.assignments.filter(a=>a.empId===id&&!a.endDate);
  cur.forEach(a=>{a.endDate=today();const dev=state.devices.find(d=>d.id===a.devId);if(dev&&dev.status==='in_use')dev.status='standby';const num=state.numbers.find(n=>n.id===a.numId);if(num&&num.status==='in_use')num.status='standby';});
  e.status='left';e.leaveDate=today();log('离职',`${e.name} 离职，回收 ${cur.length} 项分配`);save();render();}

/* ---------- 手机 ---------- */
function renderDevices(){
  const rows=state.devices.map(d=>{
    const apple=d.appleId?`${d.appleId} ${pwdCell('dev',d.id,'applePwd')}`:'—';
    const bb=d.broadband?`🔗 ${d.broadband}`:'—';
    return `<tr><td>${d.model}</td><td>${d.storage||'—'}</td><td>${d.color||'—'}</td><td class="muted">${d.sn||'—'}</td><td>${tag(DEV_ST,d.status)}</td>
      <td class="pwd-cell">${apple}</td><td>${bb}</td><td>${d.note||''}</td>
      <td><div class="row-actions"><button class="btn ghost sm" onclick="editDev('${d.id}')">编辑</button><button class="btn ghost sm" onclick="retireDev('${d.id}')">替换/报废</button><button class="btn ghost sm" onclick="delDev('${d.id}')">删除</button></div></td></tr>`;}).join('');
  return `<div class="toolbar"><button class="btn" onclick="addDev()">+ 新增手机</button></div>
    <table><thead><tr><th>型号</th><th>内存</th><th>颜色</th><th>序列号/IMEI</th><th>状态</th><th>苹果ID / 密码</th><th>绑定宽带</th><th>备注</th><th>操作</th></tr></thead><tbody>${rows||`<tr><td colspan="9" class="empty">还没有手机</td></tr>`}</tbody></table>`;
}
function devForm(d){d=d||{};const stSel=Object.entries(DEV_ST).map(([k,v])=>`<option value="${k}" ${d.status===k?'selected':''}>${v[0]}</option>`).join('');
  return field('型号*','model','text',d.model)+field('内存*','storage','text',d.storage)+field('颜色','color','text',d.color)+field('序列号/IMEI','sn','text',d.sn)+field('采购日期','buyDate','date',d.buyDate)+field('采购价','price','text',d.price)+field('苹果ID','appleId','text',d.appleId)+field('苹果密码','applePwd','text',d.applePwd)+field('绑定宽带(账号/说明)','broadband','text',d.broadband)+field('状态','status','select',null,stSel)+field('备注','note','textarea',d.note);}
function addDev(){openModal('新增手机',devForm(),true);ok(()=>{const o=readForm();if(!o.model||!o.storage){alert('请填型号和内存');return;}state.devices.push({id:uid('dev'),model:o.model,storage:o.storage,color:o.color,sn:o.sn,buyDate:o.buyDate,price:o.price,appleId:o.appleId,applePwd:o.applePwd,broadband:o.broadband,status:o.status||'standby',note:o.note});log('设备',`新增手机：${o.model} ${o.storage}`);save();closeModal();render();});}
function editDev(id){const d=state.devices.find(x=>x.id===id);openModal('编辑手机',devForm(d),true);ok(()=>{const o=readForm();if(!o.model||!o.storage){alert('请填型号和内存');return;}Object.assign(d,{model:o.model,storage:o.storage,color:o.color,sn:o.sn,buyDate:o.buyDate,price:o.price,appleId:o.appleId,applePwd:o.applePwd,broadband:o.broadband,status:o.status,note:o.note});log('设备',`编辑手机：${o.model} ${o.storage}`);save();closeModal();render();});}
function retireDev(id){const d=state.devices.find(x=>x.id===id);if(state.assignments.some(a=>a.devId===id&&!a.endDate)){alert('该手机仍有在职分配，请先在分配页结束');return;}d.status=prompt('标记为何？（填「已替换」或「报废」）','已替换').includes('报废')?'retired':'replaced';log('设备',`手机 ${d.model} 标记${d.status==='retired'?'报废':'已替换'}`);save();render();}
function delDev(id){const d=state.devices.find(x=>x.id===id);if(!confirm(`删除手机「${d.model}」？`))return;if(state.assignments.some(a=>a.devId===id)){alert('该手机有分配记录，无法删除');return;}state.devices=state.devices.filter(x=>x.id!==id);log('设备',`删除手机：${d.model}`);save();render();}

/* ---------- 号码（主副卡） ---------- */
function realInfo(n){
  const c=n.cardName?`卡实名：${n.cardName}${n.cardId?` ${pwdCell('num',n.id,'cardId')}`:''}`:'';
  const w=n.wxName?`微信实名：${n.wxName}${n.wxId?` ${pwdCell('num',n.id,'wxId')}`:''}`:'';
  return [c,w].filter(Boolean).join('<br>')||'—';
}
function renderNumbers(){
  const mains=mainNumbers();
  let rows='';
  if(!mains.length)rows=`<tr><td colspan="10" class="empty">还没有号码</td></tr>`;
  mains.forEach(m=>{
    const email=m.bindEmail?`${m.bindEmail} ${pwdCell('num',m.id,'emailPwd')}`:'—';
    rows+=`<tr class="grp-main"><td class="drag-h"><span class="handle" draggable="true" ondragstart="dragStart(event,'num','${m.id}')" ondragover="event.preventDefault()" ondrop="dropNum('${m.id}')" title="拖动整组排序">⠿</span><span class="mv"><button class="btn ghost sm" onclick="moveNum('${m.id}','up')" title="上移整组">▲</button><button class="btn ghost sm" onclick="moveNum('${m.id}','down')" title="下移整组">▼</button></span></td><td>${m.number} ${tag(NUM_TYPE,'main')}</td><td>${m.carrier||'—'}</td><td class="muted">${m.monthly||'—'}</td><td>${m.wechat||'—'} ${pwdCell('num',m.id,'wechatPwd')}</td><td class="pwd-cell">${email}</td><td>${realInfo(m)}</td><td>${tag(NUM_ST,m.status)}</td><td>${m.note||''}</td><td><div class="row-actions"><button class="btn ghost sm" onclick="editNum('${m.id}')">编辑</button><button class="btn ghost sm" onclick="delNum('${m.id}')">删除</button></div></td></tr>`;
    subOf(m.id).forEach(s=>{
      rows+=`<tr class="subrow"><td class="drag-h"></td><td>${s.number} ${tag(NUM_TYPE,'sub')}</td><td>${s.carrier||'—'}</td><td class="muted">${s.monthly||'—'}</td><td>${s.wechat||'—'} ${s.wechatPwd?pwdCell('num',s.id,'wechatPwd'):''}</td><td class="muted">${s.bindEmail?`${s.bindEmail} ${pwdCell('num',s.id,'emailPwd')}`:''}</td><td>${realInfo(s)}</td><td>${tag(NUM_ST,s.status)}</td><td>${s.note||''}</td><td><div class="row-actions"><button class="btn ghost sm" onclick="editNum('${s.id}')">编辑</button><button class="btn ghost sm" onclick="delNum('${s.id}')">删除</button></div></td></tr>`;
    });
  });
  return `<div class="toolbar"><button class="btn" onclick="addNum()">+ 新增主卡</button><button class="btn ghost" onclick="addSub()">+ 新增副卡</button>
    <span class="hint">主卡每月交话费；一个主卡最多挂 4 张副卡。左边 ⠿ 拖动或用 ▲▼ 调整整组顺序，主卡与副卡始终绑定在一起。</span></div>
    <table><thead><tr><th>排序</th><th>号码(类型)</th><th>运营商</th><th>月租</th><th>微信 / 微信密码</th><th>绑定邮箱 / 邮箱密码</th><th>实名信息(姓名+身份证)</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function numForm(n,sub){n=n||{};const stSel=Object.entries(NUM_ST).map(([k,v])=>`<option value="${k}" ${n.status===k?'selected':''}>${v[0]}</option>`).join('');
  const mainOpts=mainNumbers().map(m=>`<option value="${m.id}" ${n.parentId===m.id?'selected':''}>${m.number}</option>`).join('');
  let html=field('号码*','number','text',n.number);
  if(sub)html+=field('所属主卡*','parentId','select',null,mainOpts||'<option value="">（请先建主卡）</option>');
  html+=field('办卡实名姓名(谁的身份证实名)','cardName','text',n.cardName)+field('办卡身份证(可只几位)','cardId','text',n.cardId)+field('微信实名姓名(可与办卡不同人)','wxName','text',n.wxName)+field('微信身份证(可只几位)','wxId','text',n.wxId)+field('运营商','carrier','text',n.carrier)+field('月租','monthly','text',n.monthly)+field('绑定微信','wechat','text',n.wechat)+field('微信密码','wechatPwd','text',n.wechatPwd)+field('绑定邮箱','bindEmail','text',n.bindEmail)+field('邮箱密码','emailPwd','text',n.emailPwd)+field('状态','status','select',null,stSel)+field('备注','note','textarea',n.note);
  return html;
}
function addNum(){openModal('新增主卡',numForm(null,false),true);ok(()=>{const o=readForm();if(!o.number){alert('请填号码');return;}state.numbers.push({id:uid('num'),type:'main',number:o.number,carrier:o.carrier,monthly:o.monthly,cardName:o.cardName,cardId:o.cardId,wxName:o.wxName,wxId:o.wxId,wechat:o.wechat,wechatPwd:o.wechatPwd,bindEmail:o.bindEmail,emailPwd:o.emailPwd,status:o.status||'standby',note:o.note});log('号码',`新增主卡：${o.number}（微信 ${o.wechat||'—'}）`);save();closeModal();render();});}
function addSub(){if(!mainNumbers().length){alert('请先建一个主卡');return;}openModal('新增副卡',numForm(null,true),true);ok(()=>{const o=readForm();if(!o.number){alert('请填号码');return;}if(!o.parentId){alert('请选所属主卡');return;}const cnt=subOf(o.parentId).length;if(cnt>=4){alert('该主卡已有 4 张副卡（上限）');return;}state.numbers.push({id:uid('num'),type:'sub',parentId:o.parentId,number:o.number,carrier:o.carrier,monthly:o.monthly,cardName:o.cardName,cardId:o.cardId,wxName:o.wxName,wxId:o.wxId,wechat:o.wechat,wechatPwd:o.wechatPwd,bindEmail:o.bindEmail,emailPwd:o.emailPwd,status:o.status||'standby',note:o.note});log('号码',`新增副卡：${o.number}（挂主卡 ${nameOf(state.numbers,o.parentId)}）`);save();closeModal();render();});}
function editNum(id){const n=state.numbers.find(x=>x.id===id);openModal('编辑号码',numForm(n,n.type==='sub'),true);ok(()=>{const o=readForm();if(!o.number){alert('请填号码');return;}if(n.type==='sub'){if(!o.parentId){alert('请选所属主卡');return;}if(subOf(o.parentId).filter(x=>x.id!==id).length>=4){alert('该主卡副卡已满 4 张');return;}}Object.assign(n,{number:o.number,carrier:o.carrier,monthly:o.monthly,cardName:o.cardName,cardId:o.cardId,wxName:o.wxName,wxId:o.wxId,wechat:o.wechat,wechatPwd:o.wechatPwd,bindEmail:o.bindEmail,emailPwd:o.emailPwd,status:o.status,note:o.note});if(n.type==='sub')n.parentId=o.parentId;log('号码',`编辑号码：${o.number}`);save();closeModal();render();});}
function delNum(id){const n=state.numbers.find(x=>x.id===id);if(!confirm(`删除号码「${n.number}」？`))return;if(state.assignments.some(a=>a.numId===id)){alert('该号码有分配记录，无法删除');return;}state.numbers=state.numbers.filter(x=>x.id!==id);log('号码',`删除号码：${n.number}`);save();render();}

/* ---------- 密码库 ---------- */
function renderCreds(){
  const rows=state.credentials.map(c=>{
    const link=c.linkId?`${c.linkType==='emp'?'员工':c.linkType==='dev'?'手机':'号码'}：${nameOf(c.linkType==='emp'?state.employees:c.linkType==='dev'?state.devices:state.numbers,c.linkId)}`:'—';
    return `<tr><td>${c.name}</td><td>${c.category||'—'}</td><td>${c.account||'—'}</td><td class="pwd-cell">${pwdCell('cred',c.id,'password')}</td><td>${link}</td><td>${c.note||''}</td>
      <td><div class="row-actions"><button class="btn ghost sm" onclick="editCred('${c.id}')">编辑</button><button class="btn ghost sm" onclick="delCred('${c.id}')">删除</button></div></td></tr>`;}).join('');
  return `<div class="toolbar"><button class="btn" onclick="addCred()">+ 新增凭据</button>
    <span class="hint">监考密码、其他零散账号等都可放这里；可关联到某员工/手机/号码。</span></div>
    <table><thead><tr><th>名称/用途</th><th>分类</th><th>账号</th><th>密码</th><th>关联</th><th>备注</th><th>操作</th></tr></thead><tbody>${rows||`<tr><td colspan="7" class="empty">还没有凭据</td></tr>`}</tbody></table>`;
}
function credForm(c){c=c||{};const catOpts=['监考','苹果ID','邮箱','微信','宽带','其他'].map(x=>`<option value="${x}" ${c.category===x?'selected':''}>${x}</option>`).join('');
  const empOpts=state.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  const devOpts=state.devices.map(d=>`<option value="${d.id}">${d.model}</option>`).join('');
  const numOpts=state.numbers.map(n=>`<option value="${n.id}">${n.number}</option>`).join('');
  const linkSel=`<option value="" ${!c.linkId?'selected':''}>（不关联）</option>`+
    `<optgroup label="员工">${empOpts.map(o=>`<option value="emp:${o.match(/value="([^"]+)"/)[1]}" ${c.linkType==='emp'&&c.linkId===o.match(/value="([^"]+)"/)[1]?'selected':''}>${o.replace(/<[^>]+>/g,'')}</option>`).join('')}</optgroup>`+
    `<optgroup label="手机">${devOpts.map(o=>`<option value="dev:${o.match(/value="([^"]+)"/)[1]}" ${c.linkType==='dev'&&c.linkId===o.match(/value="([^"]+)"/)[1]?'selected':''}>${o.replace(/<[^>]+>/g,'')}</option>`).join('')}</optgroup>`+
    `<optgroup label="号码">${numOpts.map(o=>`<option value="num:${o.match(/value="([^"]+)"/)[1]}" ${c.linkType==='num'&&c.linkId===o.match(/value="([^"]+)"/)[1]?'selected':''}>${o.replace(/<[^>]+>/g,'')}</option>`).join('')}</optgroup>`;
  return field('名称/用途*','name','text',c.name)+field('分类','category','select',null,catOpts)+field('账号','account','text',c.account)+field('密码','password','text',c.password)+field('关联到','link','select',null,linkSel)+field('备注','note','textarea',c.note);}
function addCred(){openModal('新增凭据',credForm(),true);ok(()=>{const o=readForm();if(!o.name){alert('请填名称');return;}let linkType='',linkId='';if(o.link&&o.link.includes(':')){[linkType,linkId]=o.link.split(':');}state.credentials.push({id:uid('cred'),name:o.name,category:o.category,account:o.account,password:o.password,linkType,linkId,note:o.note});log('密码库',`新增凭据：${o.name}（${o.category}）`);save();closeModal();render();});}
function editCred(id){const c=state.credentials.find(x=>x.id===id);openModal('编辑凭据',credForm(c),true);ok(()=>{const o=readForm();if(!o.name){alert('请填名称');return;}let linkType='',linkId='';if(o.link&&o.link.includes(':')){[linkType,linkId]=o.link.split(':');}Object.assign(c,{name:o.name,category:o.category,account:o.account,password:o.password,linkType,linkId,note:o.note});log('密码库',`编辑凭据：${o.name}`);save();closeModal();render();});}
function delCred(id){const c=state.credentials.find(x=>x.id===id);if(!confirm(`删除凭据「${c.name}」？`))return;state.credentials=state.credentials.filter(x=>x.id!==id);log('密码库',`删除凭据：${c.name}`);save();render();}

/* ---------- 分配 / 变更 ---------- */
function renderAssign(){
  const active=state.assignments.filter(a=>!a.endDate);
  const ended=state.assignments.filter(a=>a.endDate);
  const aRows=active.map(a=>`<tr><td>${nameOf(state.employees,a.empId)}</td><td>${nameOf(state.devices,a.devId)}</td><td>${nameOf(state.numbers,a.numId)}</td><td class="muted">${a.startDate}</td>
    <td><div class="row-actions"><button class="btn ghost sm" onclick="swapDev('${a.id}')">换机</button><button class="btn ghost sm" onclick="swapNum('${a.id}')">换号</button><button class="btn danger sm" onclick="endAssign('${a.id}')">结束分配</button></div></td></tr>`).join('');
  const eRows=ended.map(a=>`<tr class="muted"><td>${nameOf(state.employees,a.empId)}</td><td>${nameOf(state.devices,a.devId)}</td><td>${nameOf(state.numbers,a.numId)}</td><td>${a.startDate} → ${a.endDate}</td><td class="muted">${a.note||''}</td></tr>`).join('');
  return `<div class="toolbar"><button class="btn" onclick="newAssign()">+ 新建分配（员工配手机+号码）</button><span class="hint">分配后手机/号码状态自动转「在用」。</span></div>
    <div class="sec-title">在职分配</div><table><thead><tr><th>员工</th><th>手机</th><th>号码</th><th>起始日</th><th>操作</th></tr></thead><tbody>${aRows||`<tr><td colspan="5" class="empty">暂无在职分配</td></tr>`}</tbody></table>
    <div class="sec-title">历史分配</div><table><thead><tr><th>员工</th><th>手机</th><th>号码</th><th>起止</th><th>备注</th></tr></thead><tbody>${eRows||`<tr><td colspan="5" class="empty">暂无历史分配</td></tr>`}</tbody></table>`;
}
function newAssign(){
  const optEmp=state.employees.filter(e=>e.status==='active').map(e=>`<option value="${e.id}">${e.name}</option>`).join('')||'<option value="">（先去新增在职员工）</option>';
  const optDev=state.devices.map(d=>`<option value="${d.id}">${d.model} ${d.storage}（${DEV_ST[d.status][0]}）</option>`).join('');
  const optNum=state.numbers.map(n=>`<option value="${n.id}">${n.number}${n.type==='sub'?'（副）':''}（${NUM_ST[n.status][0]}）</option>`).join('');
  openModal('新建分配',field('员工*','empId','select',null,optEmp)+field('手机*','devId','select',null,optDev)+field('号码*','numId','select',null,optNum)+field('起始日期*','startDate','date',today())+field('备注','note','textarea'),true);
  ok(()=>{const o=readForm();if(!o.empId||!o.devId||!o.numId){alert('请选员工/手机/号码');return;}if(state.assignments.some(a=>a.empId===o.empId&&!a.endDate)){alert('该员工已有在职分配');return;}const dev=state.devices.find(d=>d.id===o.devId);const num=state.numbers.find(n=>n.id===o.numId);dev.status='in_use';num.status='in_use';state.assignments.push({id:uid('asg'),empId:o.empId,devId:o.devId,numId:o.numId,startDate:o.startDate,note:o.note});log('分配',`${nameOf(state.employees,o.empId)} 配 ${dev.model} + 号 ${num.number}`);save();closeModal();render();});
}
function endAssign(id){const a=state.assignments.find(x=>x.id===id);const reason=prompt('结束原因（离职/换机/回收等）：','回收');if(reason===null)return;a.endDate=today();a.note=reason;const dev=state.devices.find(d=>d.id===a.devId);if(dev)dev.status='standby';const num=state.numbers.find(n=>n.id===a.numId);if(num)num.status='standby';log('变更',`结束分配：${nameOf(state.employees,a.empId)} 的 ${dev?dev.model:''} + ${num?num.number:''}（${reason}）`);save();render();}
function swapDev(id){const a=state.assignments.find(x=>x.id===id);const optDev=state.devices.filter(d=>d.status==='standby').map(d=>`<option value="${d.id}">${d.model} ${d.storage}</option>`).join('')||'<option value="">（无备用手机）</option>';openModal('换机',field('新手机*','devId','select',null,optDev)+field('换机日期','startDate','date',today()));ok(()=>{const o=readForm();if(!o.devId){alert('请选新手机');return;}const old=state.devices.find(d=>d.id===a.devId);if(old)old.status='standby';a.endDate=today();a.note='换机';const dev=state.devices.find(d=>d.id===o.devId);dev.status='in_use';state.assignments.push({id:uid('asg'),empId:a.empId,devId:o.devId,numId:a.numId,startDate:o.startDate});log('换机',`${nameOf(state.employees,a.empId)}：${old?old.model:'—'} → ${dev.model}`);save();closeModal();render();});}
function swapNum(id){const a=state.assignments.find(x=>x.id===id);const optNum=state.numbers.filter(n=>n.status==='standby').map(n=>`<option value="${n.id}">${n.number}${n.type==='sub'?'（副）':''}</option>`).join('')||'<option value="">（无备用号码）</option>';openModal('换号',field('新号码*','numId','select',null,optNum)+field('换号日期','startDate','date',today()));ok(()=>{const o=readForm();if(!o.numId){alert('请选新号码');return;}const old=state.numbers.find(n=>n.id===a.numId);if(old)old.status='standby';a.endDate=today();a.note='换号';const num=state.numbers.find(n=>n.id===o.numId);num.status='in_use';state.assignments.push({id:uid('asg'),empId:a.empId,devId:a.devId,numId:o.numId,startDate:o.startDate});log('换号',`${nameOf(state.employees,a.empId)}：${old?old.number:'—'} → ${num.number}`);save();closeModal();render();});}

/* ---------- 变更记录 ---------- */
function renderLogs(){if(!state.logs.length)return `<div class="empty">暂无变更记录</div>`;return `<div class="toolbar"><span class="hint">所有入职 / 离职 / 换机 / 换号 / 改密码都会自动记录在此，倒序排列。</span></div>`+state.logs.map(l=>`<div class="log-item"><div class="t">[${l.type}] ${l.time}</div><div class="d">${l.desc}</div></div>`).join('');}

  </div>`;
}
/* ---------- 加密备份（真加密 AES-GCM + PBKDF2，主密码派生密钥） ---------- */
function strToBytes(s){return new TextEncoder().encode(s);}
function bytesToStr(b){return new TextDecoder().decode(b);}
function xorBytes(bytes,key){const o=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)o[i]=bytes[i]^key[i%key.length];return o;}
function b64FromBytes(b){let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function bytesFromB64(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
function hasCrypto(){return !!(window.crypto&&window.crypto.subtle);}
async function deriveKey(password,salt){const km=await crypto.subtle.importKey('raw',strToBytes(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function aesEncrypt(obj,password){const salt=crypto.getRandomValues(new Uint8Array(16));const iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(password,salt);const buf=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,strToBytes(JSON.stringify(obj)));return {t:'yoga-enc',v:2,salt:[...salt],iv:[...iv],data:b64FromBytes(new Uint8Array(buf))};}
async function aesDecrypt(payload,password){const key=await deriveKey(password,new Uint8Array(payload.salt));const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(payload.iv)},key,bytesFromB64(payload.data));return JSON.parse(bytesToStr(new Uint8Array(buf)));}
/* 恢复码 + dataKey 双包裹（v3 模型）：dataKey 加密数据，主密码与恢复码各自包裹 dataKey */
function randBytes(n){return crypto.getRandomValues(new Uint8Array(n));}
async function wrapKey(dk,password){const salt=randBytes(16),iv=randBytes(12);const k=await deriveKey(password,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,dk);return {salt:[...salt],iv:[...iv],ct:b64FromBytes(new Uint8Array(ct))};}
async function unwrapKey(w,password){const k=await deriveKey(password,new Uint8Array(w.salt));const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(w.iv)},k,bytesFromB64(w.ct));return new Uint8Array(buf);}
async function encData(obj,dk){const iv=randBytes(12);const key=await crypto.subtle.importKey('raw',dk,'AES-GCM',false,['encrypt']);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,strToBytes(JSON.stringify(obj)));return {iv:[...iv],data:b64FromBytes(new Uint8Array(ct))};}
async function decData(d,dk){const key=await crypto.subtle.importKey('raw',dk,'AES-GCM',false,['decrypt']);const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(d.iv)},key,bytesFromB64(d.data));return JSON.parse(bytesToStr(new Uint8Array(buf)));}
function genRecoveryKey(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<16;i++){s+=a[Math.floor(Math.random()*a.length)];if(i===3||i===7||i===11)s+='-';}return s;}
function loadWraps(){try{return JSON.parse(localStorage.getItem(KEY_W));}catch(e){return null;}}
function saveWraps(w){try{localStorage.setItem(KEY_W,JSON.stringify(w));}catch(e){}}
async function buildPayload(){if(!dataKey)dataKey=randBytes(32);const data=await encData(state,dataKey);const mw=await wrapKey(dataKey,masterPwd);let rw=null;if(state.recoveryKey)rw=await wrapKey(dataKey,state.recoveryKey);return {t:'yoga-enc',v:3,data,masterWrap:mw,recoveryWrap:rw,hint:state.pwdHint||''};}
async function openPayload(payload,password){const wraps=[payload.masterWrap,payload.recoveryWrap].filter(Boolean);for(const w of wraps){try{const dk=await unwrapKey(w,password);dataKey=dk;return await decData(payload.data,dk);}catch(e){}}return null;}
/* 生成加密载荷（v2=AES；环境不支持强加密时回退 v1=XOR 混淆，仅作兼容） */
async function encPayload(){
  if(!state.pwdHash){alert('请先设置主密码');return null;}
  const p=prompt('输入主密码以加密导出');if(p===null)return null;
  if(!(await attemptUnlock(p))){alert('主密码错误');return null;}
  return JSON.stringify(await buildPayload());
}
/* 解密载荷（自动识别 v3/v2/v1） */
async function decPayloadObj(payload,password){
  try{
    if(payload.v===3){if(!hasCrypto()){alert('当前环境不支持强解密，请用现代浏览器（https 或新版本地浏览器）打开');return null;}return await openPayload(payload,password);}
    if(payload.v===2){if(!hasCrypto()){alert('当前环境不支持强解密，请用现代浏览器（https 或新版本地浏览器）打开');return null;}return await aesDecrypt(payload,password);}
    const dec=xorBytes(bytesFromB64(payload.data),strToBytes(password));return JSON.parse(bytesToStr(dec));
  }catch(e){return null;}
}
async function bootUnlock(){
  const p=document.getElementById('bootPwd').value;
  if(!p){alert('请输入主密码或恢复码');return;}
  let d=await openPayload(bootEnc,p);
  if(!d){const r=prompt('解锁失败。如忘记主密码，可输入恢复码，取消则重试：');if(r)d=await openPayload(bootEnc,r);}
  if(!d){alert('解锁失败');return;}
  state=d;save();
  saveWraps({masterWrap:bootEnc.masterWrap,recoveryWrap:bootEnc.recoveryWrap,recoveryKey:state.recoveryKey||'',pwdHint:state.pwdHint||''});
  unlocked=true;masterPwd=p;bootEnc=null;
  document.getElementById('bootLock').style.display='none';
  renderLock();render();toast('已解锁');maybeAutoPull();
}

function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='恒伽瑜伽备份_明文_'+today()+'.json';a.click();log('备份','导出明文备份');toast('已下载明文备份');}

async function exportSelf(){
  if(!state.pwdHash){alert('请先在备份设置里设置主密码');return;}
  const p=prompt('输入主密码（将用于加密嵌入此文件，打开时需输入它）');if(p===null)return;
  if(cyrb53(p)!==state.pwdHash){alert('主密码错误');return;}
  let payload;
  if(hasCrypto())payload=await buildPayload();
  else{const enc=xorBytes(strToBytes(JSON.stringify(state)),strToBytes(p));payload={t:'yoga-enc',v:1,data:b64FromBytes(enc)};}
  const encJson=JSON.stringify(payload).replace(/<\/script>/gi,'<\\/script>');
  const tpl=document.documentElement.outerHTML;
  const injected=tpl.replace('</head>',`<script>window.__ENC__=${encJson};<\/script></head>`);
  const blob=new Blob([injected],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='恒伽瑜伽管理系统_加密数据_'+today()+'.html';a.click();

}
async function importBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='.aes.json,.json,.aes';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const raw=r.result;if(raw.indexOf('yoga-enc')>=0){let payload;try{payload=JSON.parse(raw);}catch(e){alert('文件格式错误');return;}const p=prompt('输入主密码以解密导入');if(p===null)return;const d=await decPayloadObj(payload,p);if(!d){alert('主密码错误或文件损坏');return;}if(!confirm('导入将覆盖当前数据，确认？'))return;state=d;save();if(payload.masterWrap){saveWraps({masterWrap:payload.masterWrap,recoveryWrap:payload.recoveryWrap,recoveryKey:state.recoveryKey||'',pwdHint:state.pwdHint||''});}log('备份','从加密文件恢复');render();alert('恢复成功');}else{const d=JSON.parse(raw);if(!confirm('导入将覆盖当前数据，确认？'))return;state=d;state.pwdHash=state.pwdHash||null;save();log('备份','导入明文备份');render();alert('导入成功');}}catch(e){alert('文件格式错误');}};r.readAsText(f);};inp.click();}

function wipe(){if(!confirm('确认清空全部数据？不可恢复！'))return;state={pwdHash:state.pwdHash,employees:[],devices:[],numbers:[],credentials:[],assignments:[],logs:[]};save();render();}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- GitHub 自动云同步（自主可控：仅写入你自己的私有仓库） ---------- */
const SYNC_KEY='yoga_sync_cfg';
let syncCfg={provider:'gitee',owner:'',repo:'',path:'yoga-data.aes.json',branch:'master',token:'',enabled:false};
let syncSha=null;
let syncTimer=null;
let syncState='idle'; // idle | syncing | ok | error
try{const s=localStorage.getItem(SYNC_KEY);if(s)Object.assign(syncCfg,JSON.parse(s));}catch(e){}
function saveSyncCfg(){localStorage.setItem(SYNC_KEY,JSON.stringify(syncCfg));}
function utf8ToB64(str){return btoa(unescape(encodeURIComponent(str)));}
function b64ToUtf8(b64){return decodeURIComponent(escape(atob(b64.replace(/\n/g,''))));}
function apiBase(){return syncCfg.provider==='gitee'?'https://gitee.com/api/v5':'https://api.github.com';}
/* GitHub 国内偶尔抽风：网络层失败自动重试（HTTP 错误不重试） */
async function fetchRetry(url,opts,attempts){
  attempts=attempts||3;let lastErr;
  for(let i=0;i<attempts;i++){
    try{return await fetch(url,opts);}catch(e){lastErr=e;if(i<attempts-1)await new Promise(r=>setTimeout(r,800*(i+1)));}
  }
  throw lastErr;
}
function authQs(){return syncCfg.provider==='gitee'?('?access_token='+encodeURIComponent(syncCfg.token)):'';}
function authHeaders(){if(syncCfg.provider==='gitee')return {'Content-Type':'application/json','Accept':'application/json'};return {'Authorization':'Bearer '+syncCfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'};}
function setSyncBadge(){
  const map={idle:'⚪ 未同步',syncing:'🔄 同步中…',ok:'🟢 已同步',error:'🔴 同步失败'};
  ['syncBadge','syncBadgeTop'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=map[syncState]||map.idle;});
}
function updateStatusBar(){
  const pill=document.getElementById('lockPill');const txt=document.getElementById('lockText');const store=document.getElementById('storeText');const mini=document.getElementById('syncBadgeMini');
  if(!pill||!txt||!store||!mini)return;
  if(unlocked){pill.classList.add('on');pill.classList.remove('off');txt.textContent='查看已解锁';}
  else{pill.classList.add('off');pill.classList.remove('on');txt.textContent='数据已锁定';}
  store.textContent=window.__ENC__?'本文件含加密数据':'数据存于本机浏览器';
  const map={idle:'未同步',syncing:'同步中…',ok:'已同步',error:'同步失败'};
  mini.textContent=syncCfg.enabled?map[syncState]||'未同步':'自动同步未开启';
}
function bindRipples(){
  document.querySelectorAll('.btn').forEach(btn=>{
    if(btn._ripple)return;
    btn._ripple=true;
    btn.addEventListener('click',function(e){
      const r=document.createElement('span');r.className='ripple';
      const rect=this.getBoundingClientRect();
      const size=Math.max(rect.width,rect.height);
      r.style.width=r.style.height=size+'px';
      r.style.left=(e.clientX-rect.left-size/2)+'px';
      r.style.top=(e.clientY-rect.top-size/2)+'px';
      this.appendChild(r);
      setTimeout(()=>r.remove(),600);
    });
  });
}
function staggerRows(){
  document.querySelectorAll('tbody tr').forEach((tr,i)=>{tr.style.animationDelay=(i*0.05)+'s';});
}
function syncActive(){return syncCfg.enabled&&syncCfg.token&&syncCfg.owner&&syncCfg.repo&&masterPwd&&unlocked;}
async function syncPush(){
  if(!syncActive())return;
  syncState='syncing';setSyncBadge();
  try{
    const payload=await buildPayload();
    const content=utf8ToB64(JSON.stringify(payload));
    const url=`${apiBase()}/repos/${encodeURIComponent(syncCfg.owner)}/${encodeURIComponent(syncCfg.repo)}/contents/${encodeURIComponent(syncCfg.path)}${authQs()}`;
    const body={message:'恒伽瑜伽 自动同步 '+new Date().toLocaleString('zh-CN'),content};
    if(syncCfg.provider==='gitee')body.branch=syncCfg.branch||'master';
    if(syncSha)body.sha=syncSha;
    const res=await fetchRetry(url,{method:'PUT',headers:authHeaders(),body:JSON.stringify(body)});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||('HTTP '+res.status));}
    const r=await res.json();syncSha=r.content.sha;syncState='ok';
  }catch(e){syncState='error';console.error('syncPush失败',e);}
  setSyncBadge();
}
function scheduleSync(){if(!syncActive())return;clearTimeout(syncTimer);syncTimer=setTimeout(syncPush,1500);}
async function syncPull(){
  if(!syncCfg.token||!syncCfg.owner||!syncCfg.repo){alert('请先在「自动云同步」里填写用户名、仓库与令牌');return false;}
  if(!masterPwd){alert('请先解锁主密码再拉取');return false;}
  syncState='syncing';setSyncBadge();
  try{
    const url=`${apiBase()}/repos/${encodeURIComponent(syncCfg.owner)}/${encodeURIComponent(syncCfg.repo)}/contents/${encodeURIComponent(syncCfg.path)}${authQs()}`;
    const res=await fetchRetry(url,{headers:authHeaders()});
    if(res.status===404)return false;
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||('HTTP '+res.status));}
    const r=await res.json();syncSha=r.sha;
    const payload=JSON.parse(b64ToUtf8(r.content));
    const d=await decPayloadObj(payload,masterPwd);
    if(!d){alert('云端数据解密失败（主密码不符或文件损坏）');syncState='error';setSyncBadge();return false;}
    state=d;state.pwdHash=state.pwdHash||null;save();render();
    if(payload.masterWrap)saveWraps({masterWrap:payload.masterWrap,recoveryWrap:payload.recoveryWrap,recoveryKey:state.recoveryKey||'',pwdHint:state.pwdHint||''});
    syncState='ok';setSyncBadge();return true;
  }catch(e){syncState='error';setSyncBadge();alert('拉取失败：'+e.message);return false;}
}
async function maybeAutoPull(){
  if(!syncActive())return;
  const empty=!state.employees.length&&!state.devices.length&&!state.numbers.length&&!state.credentials.length;
  if(empty){const ok=await syncPull();if(ok)toast('已从云端同步数据');}
}
function saveSync(){
  syncCfg.provider=document.getElementById('syProvider').value;
  syncCfg.owner=document.getElementById('syOwner').value.trim();
  syncCfg.repo=document.getElementById('syRepo').value.trim();
  syncCfg.path=document.getElementById('syPath').value.trim()||'yoga-data.aes.json';
  syncCfg.branch=document.getElementById('syBranch').value.trim()||'master';
  syncCfg.token=document.getElementById('syToken').value.trim();
  syncCfg.enabled=document.getElementById('syEnabled').checked;
  saveSyncCfg();syncSha=null;
  toast('同步设置已保存');
  if(syncCfg.enabled&&masterPwd&&unlocked)maybeAutoPull();
}
async function testSync(){
  if(!syncCfg.token||!syncCfg.owner||!syncCfg.repo){alert('请先填写用户名、仓库与令牌');return;}
  syncState='syncing';setSyncBadge();
  try{
    const url=`${apiBase()}/repos/${encodeURIComponent(syncCfg.owner)}/${encodeURIComponent(syncCfg.repo)}${authQs()}`;
    const res=await fetch(url,{headers:authHeaders()});
    if(res.status===404){alert('仓库不存在，请确认仓库名与可见性（需为私有或你自己的公开库）');syncState='error';}
    else if(res.status===401||res.status===403){alert('令牌无效或无权限，请检查令牌范围（需含 repo）');syncState='error';}
    else if(res.ok){alert('连接成功！可勾选「启用自动同步」');syncState='ok';}
    else{alert('未知错误：HTTP '+res.status);syncState='error';}
  }catch(e){alert('请求失败：'+e.message);syncState='error';}
  setSyncBadge();
}
function syncPullNow(){syncPull().then(ok=>{if(ok)toast('已从云端拉取');});}
function syncPushNow(){syncPush();}


/* ---------- 启动 ---------- */
function ok(fn){document.getElementById('modalOk').onclick=fn;}
renderLock();
if(bootEnc){document.getElementById('bootLock').style.display='flex';}
render();
</script>
